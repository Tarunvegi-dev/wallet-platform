spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) [corrId=%X{correlationId:-N/A}] [%clr(${spring.application.name}){cyan}] %clr([%thread]){yellow} %clr(%logger{36}){blue} - %msg%n"

management:
  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    resource-attributes:
      service.name: payment-service

    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces

server:
  port: 8081
